name: One-time purge exposed Kaggle credential

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: purge-kaggle-secret
  cancel-in-progress: false

jobs:
  purge-history:
    runs-on: ubuntu-latest
    steps:
      - name: Remove credential file from every branch history
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" repository.git
          cd repository.git
          python -m pip install --disable-pip-version-check --quiet "git-filter-repo==2.47.0"
          git filter-repo --sensitive-data-removal --invert-paths --path assets/kaggle.json --force
          if git rev-list --all --objects | grep -Eq '(^| )assets/kaggle\.json$'; then
            echo "Credential file is still present in rewritten history." >&2
            exit 1
          fi
          git remote add cleaned "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          git push --force cleaned --all
          git push --force cleaned --tags
